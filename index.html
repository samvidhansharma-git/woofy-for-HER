<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Woofy for Sahasraa! 🐶</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(160deg, #87CEEB 0%, #b0e4ff 50%, #d4f1c4 100%);
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }
  .title {
    font-family: 'Fredoka One', cursive;
    font-size: 2.2rem;
    color: #e08a2b;
    text-shadow: 3px 3px 0 #a85d12;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .dog-stage {
    position: relative;
    width: 260px;
    height: 280px;
    cursor: pointer;
    user-select: none;
  }
  .dog-body {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    transition: transform 0.1s;
  }
  .dog-stage:active .dog-body { transform: translateX(-50%) scale(0.95); }
  .dog-stage.talking .dog-body { animation: dogTalk 0.2s ease infinite; }
  @keyframes dogTalk {
    0%,100% { transform: translateX(-50%) rotate(0deg); }
    25% { transform: translateX(-50%) rotate(-3deg) translateY(-3px); }
    75% { transform: translateX(-50%) rotate(3deg) translateY(-3px); }
  }
  @keyframes dogBounce {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-18px); }
  }
  .dog-stage.bouncing .dog-body { animation: dogBounce 0.5s ease infinite; }
  .tail { transform-origin: 150px 175px; animation: wag 0.5s ease-in-out infinite alternate; }
  .dog-stage.talking .tail, .dog-stage.bouncing .tail { animation-duration: 0.18s; }
  @keyframes wag { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
  .speech-bubble {
    position: absolute;
    top: -10px;
    right: -20px;
    background: white;
    border-radius: 20px;
    padding: 10px 14px;
    font-size: 0.82rem;
    font-weight: 700;
    color: #333;
    max-width: 180px;
    text-align: center;
    box-shadow: 3px 3px 0 #ddd;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 10;
    pointer-events: none;
  }
  .speech-bubble::after {
    content:'';
    position:absolute;
    bottom:-14px;
    left:30px;
    border:8px solid transparent;
    border-top-color:white;
  }
  .speech-bubble.visible { opacity:1; transform:scale(1); }
  .grass {
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:240px; height:50px;
    background:radial-gradient(ellipse at center, #7fd36b 0%, #5cb85c 100%);
    border-radius:50%;
    box-shadow:0 4px 0 #3a8a3a;
  }
  .controls { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  .btn {
    background:#e08a2b; border:none; border-radius:50px; padding:9px 18px;
    font-family:'Nunito',sans-serif; font-size:0.85rem; font-weight:800; color:white;
    cursor:pointer; box-shadow:0 4px 0 #a85d12; transition:all 0.1s;
  }
  .btn:hover{background:#cf7c1f;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a85d12;}
  .btn.blue{background:#4ab3f4;box-shadow:0 4px 0 #1a88cc;} .btn.blue:hover{background:#2da0e6;}
  .btn.green{background:#5cb85c;box-shadow:0 4px 0 #3a8a3a;} .btn.green:hover{background:#4caa4c;}
  .btn.pink{background:#e85d9a;box-shadow:0 4px 0 #b33a74;} .btn.pink:hover{background:#d44c8a;}
  .input-area {
    display:flex; gap:8px; margin-top:10px; align-items:center;
    background:white; border-radius:50px; padding:6px 6px 6px 16px;
    box-shadow:0 3px 10px rgba(0,0,0,0.15); width:310px; max-width:95vw;
  }
  .input-area input { flex:1; border:none; outline:none; font-family:'Nunito',sans-serif; font-size:0.9rem; color:#333; background:transparent; }
  .input-area button { background:#e08a2b; border:none; border-radius:50px; padding:8px 16px; font-family:'Nunito',sans-serif; font-weight:800; color:white; cursor:pointer; font-size:0.85rem; }
  .input-area button:hover{background:#cf7c1f;}
  .heart { position:fixed; animation:floatUp 1.5s ease-out forwards; font-size:1.5rem; pointer-events:none; z-index:200; }
  @keyframes floatUp { 0%{opacity:1;transform:translateY(0) scale(1);} 100%{opacity:0;transform:translateY(-150px) scale(1.5);} }
  .voice-indicator {
    display:flex; align-items:center; gap:6px; margin-bottom:8px;
    background:rgba(255,255,255,0.6); border-radius:50px; padding:5px 14px;
    font-size:0.78rem; font-weight:700; color:#555;
  }
  .voice-dot { width:10px; height:10px; border-radius:50%; background:#ccc; transition:background 0.2s; }
  .voice-dot.active { background:#5cb85c; animation:pulse 0.5s ease infinite alternate; }
  @keyframes pulse { from{transform:scale(1);} to{transform:scale(1.4);} }
</style>
</head>
<body>

<div id="heartsLayer" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100;"></div>

<div class="title">🐶 Woofy for Sahasraa!</div>

<div class="voice-indicator">
  <div class="voice-dot" id="voiceDot"></div>
  <span id="voiceStatus">Tap the puppy to hear Woofy bark!</span>
</div>

<div class="dog-stage" id="dogStage">
  <div class="speech-bubble" id="speechBubble">Woof! 🐶</div>
  <div class="dog-body" id="dogBody">
    <svg width="200" height="220" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
      <!-- shadow -->
      <ellipse cx="100" cy="212" rx="62" ry="8" fill="rgba(0,0,0,0.12)"/>
      <!-- tail -->
      <g class="tail">
        <path d="M150 175 Q185 160 178 125 Q176 118 170 124 Q172 150 148 160 Z" fill="#B97A3A"/>
        <circle cx="174" cy="124" r="6" fill="#F5DEB3"/>
      </g>
      <!-- body -->
      <ellipse cx="100" cy="165" rx="58" ry="48" fill="#D9A066"/>
      <ellipse cx="100" cy="178" rx="34" ry="32" fill="#F5DEB3"/>
      <!-- front paws -->
      <ellipse cx="76" cy="205" rx="17" ry="10" fill="#F5DEB3"/>
      <ellipse cx="124" cy="205" rx="17" ry="10" fill="#F5DEB3"/>
      <line x1="70" y1="204" x2="70" y2="210" stroke="#d6b88a" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="76" y1="205" x2="76" y2="211" stroke="#d6b88a" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="82" y1="204" x2="82" y2="210" stroke="#d6b88a" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="118" y1="204" x2="118" y2="210" stroke="#d6b88a" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="124" y1="205" x2="124" y2="211" stroke="#d6b88a" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="130" y1="204" x2="130" y2="210" stroke="#d6b88a" stroke-width="1.5" stroke-linecap="round"/>
      <!-- floppy ears (behind head) -->
      <ellipse cx="55" cy="82" rx="20" ry="36" fill="#9A5F25" transform="rotate(15,55,82)"/>
      <ellipse cx="145" cy="82" rx="20" ry="36" fill="#9A5F25" transform="rotate(-15,145,82)"/>
      <!-- head -->
      <circle cx="100" cy="85" r="46" fill="#D9A066"/>
      <ellipse cx="86" cy="58" rx="16" ry="9" fill="rgba(255,255,255,0.25)" transform="rotate(-20,86,58)"/>
      <!-- forehead blaze -->
      <path d="M100 42 Q92 62 96 80 L104 80 Q108 62 100 42Z" fill="#F5DEB3"/>
      <!-- muzzle -->
      <ellipse cx="100" cy="105" rx="30" ry="22" fill="#F5DEB3"/>
      <!-- cheeks blush -->
      <circle cx="68" cy="98" r="7" fill="#ff9aa8" opacity="0.5"/>
      <circle cx="132" cy="98" r="7" fill="#ff9aa8" opacity="0.5"/>
      <!-- eyes -->
      <circle cx="80" cy="76" r="10" fill="white"/>
      <circle cx="120" cy="76" r="10" fill="white"/>
      <circle cx="82" cy="75" r="6" fill="#1a1a1a" id="eyeL"/>
      <circle cx="122" cy="75" r="6" fill="#1a1a1a" id="eyeR"/>
      <circle cx="84" cy="73" r="2.2" fill="white" id="shineL"/>
      <circle cx="124" cy="73" r="2.2" fill="white" id="shineR"/>
      <!-- eyebrows -->
      <path d="M70 62 Q80 57 90 62" stroke="#9A5F25" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M110 62 Q120 57 130 62" stroke="#9A5F25" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- nose -->
      <ellipse cx="100" cy="94" rx="10" ry="7" fill="#2b2b2b"/>
      <ellipse cx="97" cy="91.5" rx="3" ry="1.8" fill="rgba(255,255,255,0.5)"/>
      <line x1="100" y1="100" x2="100" y2="108" stroke="#5a3a1a" stroke-width="2" stroke-linecap="round"/>
      <!-- mouth -->
      <path id="mouth" d="M86 107 Q93 116 100 108 Q107 116 114 107" fill="none" stroke="#5a3a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse id="tongue" cx="100" cy="118" rx="8" ry="8" fill="#ff7a9a" opacity="0"/>
      <!-- collar -->
      <path d="M62 128 Q100 150 138 128 L135 138 Q100 160 65 138 Z" fill="#e8454f"/>
      <circle cx="100" cy="152" r="8" fill="#FFD700" stroke="#d4a900" stroke-width="1.5"/>
      <path d="M100 148 L101.6 151 L105 151.4 L102.5 153.6 L103.2 157 L100 155.3 L96.8 157 L97.5 153.6 L95 151.4 L98.4 151Z" fill="#fff3a0"/>
    </svg>
  </div>
  <div class="grass"></div>
</div>

<div class="controls">
  <button class="btn blue" onclick="makeHappy()">💛 Happy</button>
  <button class="btn green" onclick="makeDance()">💃 Dance</button>
  <button class="btn pink" onclick="sendLove()">❤️ Love</button>
  <button class="btn" onclick="makeWoof()">🔊 Woof!</button>
</div>

<div class="input-area">
  <input type="text" id="customText" placeholder="Type for Woofy to say..." maxlength="60"/>
  <button onclick="sayCustom()">Say it!</button>
</div>

<script>
const stage = document.getElementById('dogStage');
const bubble = document.getElementById('speechBubble');
const mouth = document.getElementById('mouth');
const tongue = document.getElementById('tongue');
const voiceDot = document.getElementById('voiceDot');
const voiceStatus = document.getElementById('voiceStatus');

let talkTimeout, mouthAnim, isTalking = false;

const woofs = [
  "Woof woof! Hi Sahasraa!",
  "I love you Sahasraa! Woof!",
  "Arf arf! You are amazing!",
  "Sahasraa is my favourite human! Woof!",
  "Wag wag wag! Woof woof!",
  "You make me so happy Sahasraa! Woof!",
  "Treats please! Woof woof!",
  "I am the cutest puppy! Woof!",
  "Sahasraa and Woofy, best friends forever!",
  "Woof woof woof! I love you!",
];

const MOUTH_CLOSED = 'M86 107 Q93 116 100 108 Q107 116 114 107';
const MOUTH_OPEN = 'M86 107 Q100 134 114 107 Q100 112 86 107Z';

// ---- Real dog-bark sounds, synthesized with the Web Audio API ----
let audioCtx = null;
let noiseBuf = null;
let barkTimers = [];

function getCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function getNoise(ctx) {
  if (!noiseBuf) {
    noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.4), ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}

function playBark(ctx, t, pitch, dur) {
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.0001, t);
  master.gain.exponentialRampToValueAtTime(0.9, t + 0.015);
  master.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  master.connect(ctx.destination);

  // vocal-cord buzz that drops in pitch, like a "ruff!"
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(520 * pitch, t);
  osc.frequency.exponentialRampToValueAtTime(240 * pitch, t + dur);

  // two sweeping formant filters give the "wuh-oof" mouth shape
  const f1 = ctx.createBiquadFilter();
  f1.type = 'bandpass'; f1.Q.value = 3;
  f1.frequency.setValueAtTime(900, t);
  f1.frequency.exponentialRampToValueAtTime(500, t + dur);
  const g1 = ctx.createGain(); g1.gain.value = 1.0;

  const f2 = ctx.createBiquadFilter();
  f2.type = 'bandpass'; f2.Q.value = 4;
  f2.frequency.setValueAtTime(1900, t);
  f2.frequency.exponentialRampToValueAtTime(1100, t + dur);
  const g2 = ctx.createGain(); g2.gain.value = 0.7;

  osc.connect(f1); f1.connect(g1); g1.connect(master);
  osc.connect(f2); f2.connect(g2); g2.connect(master);

  // breathy growl noise
  const n = ctx.createBufferSource();
  n.buffer = getNoise(ctx);
  const nf = ctx.createBiquadFilter();
  nf.type = 'bandpass'; nf.frequency.value = 1400; nf.Q.value = 1.2;
  const ng = ctx.createGain(); ng.gain.value = 0.45;
  n.connect(nf); nf.connect(ng); ng.connect(master);

  osc.start(t); osc.stop(t + dur + 0.03);
  n.start(t); n.stop(t + dur + 0.03);
}

function barkSpeech(text) {
  barkTimers.forEach(clearTimeout);
  barkTimers = [];
  const ctx = getCtx();
  if (!ctx) {
    voiceStatus.textContent = "Sound not supported in this browser 😢";
    animateMouth(true);
    return;
  }
  const words = text.trim().split(/\s+/).length;
  const count = Math.min(3, Math.max(2, Math.ceil(words / 3)));
  const excited = text.includes('!');
  const now = ctx.currentTime + 0.05;
  let t = now;

  voiceDot.classList.add('active');
  voiceStatus.textContent = "Woofy is barking...";

  for (let i = 0; i < count; i++) {
    const isLast = i === count - 1;
    const dur = (isLast ? 0.26 : 0.17) + Math.random() * 0.05;
    const pitch = (0.9 + Math.random() * 0.35) * (excited ? 1.1 : 1);
    playBark(ctx, t, pitch, dur);
    const openAt = (t - now) * 1000 + 50;
    barkTimers.push(setTimeout(() => setMouth(true), openAt));
    barkTimers.push(setTimeout(() => setMouth(false), openAt + dur * 1000));
    t += dur + 0.12 + Math.random() * 0.08;
  }
  barkTimers.push(setTimeout(() => speakShort(text), (t - now) * 1000 + 100));
}

// After the barks, Woofy says just a few words in a squeaky puppy voice
function finishTalking() {
  voiceDot.classList.remove('active');
  voiceStatus.textContent = "Tap puppy to hear Woofy bark!";
  stopTalking();
}

function speakShort(text) {
  const clean = text.replace(/[^\w\s'!?,]/g, '').replace(/\b(woof|arf|quack)\b/gi, '').trim();
  const short = clean.split(/\s+/).slice(0, 4).join(' ');
  if (!short || !window.speechSynthesis) { finishTalking(); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(short);
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => /female|girl|zira|samantha|karen|victoria|moira|fiona|tessa/i.test(v.name));
  if (preferred) utter.voice = preferred;
  utter.pitch = 2;
  utter.rate = 1.05;
  utter.volume = 1.0;
  utter.onstart = () => animateMouth(true);
  utter.onend = finishTalking;
  utter.onerror = finishTalking;
  window.speechSynthesis.speak(utter);
}

function say(text, spokenText) {
  bubble.textContent = text;
  bubble.classList.add('visible');
  stage.classList.remove('bouncing');
  stage.classList.add('talking');
  isTalking = true;
  barkSpeech(spokenText || text);
  clearTimeout(talkTimeout);
  talkTimeout = setTimeout(() => stopTalking(), 6000);
}

function stopTalking() {
  stage.classList.remove('talking');
  bubble.classList.remove('visible');
  animateMouth(false);
  isTalking = false;
}

function setMouth(open) {
  if (open) {
    mouth.setAttribute('d', MOUTH_OPEN);
    mouth.setAttribute('fill', '#7a2e3a');
    tongue.setAttribute('opacity', '1');
  } else {
    mouth.setAttribute('d', MOUTH_CLOSED);
    mouth.setAttribute('fill', 'none');
    tongue.setAttribute('opacity', '0');
  }
}

function animateMouth(talk) {
  clearInterval(mouthAnim);
  if (!talk) { setMouth(false); return; }
  let o = false;
  mouthAnim = setInterval(() => { o = !o; setMouth(o); }, 180);
}

function makeWoof() {
  const q = woofs[Math.floor(Math.random() * woofs.length)];
  say(q + ' 🐶', q);
  spawnFloating(['🐾'], 5);
}

function makeHappy() {
  say("Sahasraa is the BEST! 💛🌟", "Sahasraa is the best! Woof woof!");
  spawnFloating(['⭐','💛','✨'], 8);
}

function makeDance() {
  say("Let's DANCE! 🎵🐶", "Let's dance! Woof woof woof!");
  stage.classList.add('bouncing');
  setTimeout(() => stage.classList.remove('bouncing'), 3500);
  spawnFloating(['🎵','🎶'], 10);
}

function sendLove() {
  say("Lots of love for Sahasraa! 💕", "Lots of love for Sahasraa! Woof!");
  spawnFloating(['❤️','💕','💖','🧡'], 12);
}

function sayCustom() {
  const inp = document.getElementById('customText');
  const val = inp.value.trim();
  if (val) { say(val + ' 🐶', val); inp.value = ''; }
  else makeWoof();
}

document.getElementById('customText').addEventListener('keydown', e => {
  if (e.key === 'Enter') sayCustom();
});

stage.addEventListener('click', () => makeWoof());

function spawnFloating(emojis, count) {
  const layer = document.getElementById('heartsLayer');
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      h.style.left = (15 + Math.random()*70) + '%';
      h.style.bottom = (20 + Math.random()*30) + '%';
      h.style.fontSize = (1 + Math.random()) + 'rem';
      layer.appendChild(h);
      setTimeout(() => h.remove(), 1600);
    }, i * 120);
  }
}

document.addEventListener('mousemove', e => {
  const dog = document.getElementById('dogBody').getBoundingClientRect();
  const cx = dog.left + dog.width/2, cy = dog.top + dog.height/3;
  const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
  const ox = Math.cos(angle)*2.5, oy = Math.sin(angle)*2.5;
  document.getElementById('eyeL').setAttribute('cx', 82+ox);
  document.getElementById('eyeL').setAttribute('cy', 75+oy);
  document.getElementById('eyeR').setAttribute('cx', 122+ox);
  document.getElementById('eyeR').setAttribute('cy', 75+oy);
  document.getElementById('shineL').setAttribute('cx', 84+ox);
  document.getElementById('shineL').setAttribute('cy', 73+oy);
  document.getElementById('shineR').setAttribute('cx', 124+ox);
  document.getElementById('shineR').setAttribute('cy', 73+oy);
});

setTimeout(() => {
  say("Hi Sahasraa! I am Woofy the puppy! Woof woof!", "Hi Sahasraa! I am Woofy the puppy! Woof woof!");
}, 800);
</script>
</body>
</html>
